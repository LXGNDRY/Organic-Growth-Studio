name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  organic-growth-studio:
    name: Organic Growth Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Blocks on anything shipped to production. Dev-tool advisories are not
      # gated here: the current ones live in the latest releases of Next and
      # Vitest, so failing on them would mean a permanently red pipeline that
      # no one can act on. Dependabot tracks those instead.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      # Three real secrets live in .env.local on a running install, so the
      # cheapest guard is making it impossible to commit one unnoticed.
      - name: Reject committed env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "These env files are tracked in git:"
            echo "$tracked"
            echo "Secrets belong in an untracked .env.local; only .env.example is committed."
            exit 1
          fi
          echo "No tracked env files."

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
      - run: pnpm build
