name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-shared:
    name: Shared Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @instagro/shared run typecheck
      - run: pnpm --filter @instagro/shared run test:ci

  typescript-web:
    name: Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @instagro/web run typecheck
      - run: pnpm --filter @instagro/web run build
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1" }

  python-workers:
    name: Python Workers
    runs-on: ubuntu-latest
    services:
      redis: { image: redis:7, ports: ["6379:6379"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/workers/requirements.txt pytest pytest-asyncio
      - run: ruff check apps/workers/src apps/workers/tests
        continue-on-error: true
        working-directory: apps/workers
      - run: pytest tests/ -v
        working-directory: apps/workers
        env: { REDIS_URL: "redis://localhost:6379/0" }

  python-api:
    name: Python API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: instagro_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/api/requirements.txt pytest pytest-asyncio
      - run: ruff check app/
        continue-on-error: true
        working-directory: apps/api
      - run: pytest tests/ -v
        working-directory: apps/api
        env: { DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/instagro_test", DATABASE_URL_SYNC: "postgresql://postgres:postgres@localhost:5432/instagro_test", JWT_SECRET_KEY: "test-secret" }
